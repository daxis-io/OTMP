name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  # Native DataFusion test binaries otherwise dominate hosted-runner disk use.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo fmt --manifest-path qualification/reader-comparison/Cargo.toml --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo install cargo-nextest --version 0.9.114 --locked
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --workspace --doc
      - run: cargo test -p otmp-s3 --example provider_evidence
      - run: cargo test -p otmp-datafusion --example reader_scale
      - run: python3 -W error::ResourceWarning -m unittest discover -s qualification/reader-scale/tests -v
      - run: python3 -W error::ResourceWarning -m unittest discover -s qualification/reader-comparison/tests -v
      - run: cargo build -p otmp-datafusion --example reader_scale
      - run: python3 qualification/reader-scale/smoke.py --binary target/debug/examples/reader_scale
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo test -p otmp-protocol --test conformance_fixtures
      - run: cargo test -p otmp --test static_tables
      - run: python3 conformance/regenerate.py --check
      - run: git diff --exit-code
  crash-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show
      - run: bash tests/run-subprocess.sh
  wasm-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo check -p otmp-protocol --target wasm32-unknown-unknown
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check

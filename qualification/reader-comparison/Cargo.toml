[workspace]

[package]
name = "otmp-reader-comparison"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
datafusion = { version = "=55.0.0", default-features = false, features = ["parquet", "sql"] }
futures-util = "0.3.34"
iceberg = { git = "https://github.com/apache/iceberg-rust.git", rev = "28ede505ebc3a274d4840624e5c85eae480a77ae" }
iceberg-datafusion = { git = "https://github.com/apache/iceberg-rust.git", rev = "28ede505ebc3a274d4840624e5c85eae480a77ae" }
otmp = { path = "../../otmp" }
otmp-datafusion = { path = "../../otmp-datafusion" }
parquet = "=59.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"

[profile.release]
codegen-units = 1
lto = "thin"

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0", # Mozilla root certificate data via webpki-root-certs.
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

[[licenses.exceptions]]
name = "tiny-keccak"
version = "2.0.2"
allow = ["CC0-1.0"] # Arrow's ahash compile-time random seed dependency.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
